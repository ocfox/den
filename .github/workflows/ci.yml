name: "CI & Binary Cache"

on:
  push:
    branches: ["master"]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@main

      - name: Setup Cachix
        uses: cachix/cachix-action@v15
        with:
          name: oc
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}

      - name: Build system toplevels
        run: |
          nix build .#nixosConfigurations.{gallery,kumo,light}.config.system.build.toplevel --no-link
